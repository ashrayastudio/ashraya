<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>ashraya.ai</title>
  <style>
    :root {
      color-scheme: light;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      background: #f7f4ee;
      color: #1f2925;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
    }

    main {
      width: min(100%, 38rem);
      padding: clamp(2rem, 8vw, 4rem);
      border: 1px solid #d8d2c7;
      border-radius: 1rem;
      background: #fffdf9;
      text-align: center;
    }

    p {
      margin: 0 0 1rem;
      color: #53625b;
      font-size: 0.875rem;
      letter-spacing: 0.08em;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.75rem, 5vw, 2.5rem);
      line-height: 1.2;
    }
  </style>
</head>
<body>
  <main>
    <p>ashraya.ai</p>
    <h1>Product information is being updated.</h1>
  </main>
</body>
</html>
